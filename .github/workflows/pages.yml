name: Publish Sipariş Takip
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: node --check app.js && node --check sw.js && node --check config.js && node --check updates.js && node --check scripts/package-release.mjs
      - name: Package public files
        run: |
          mkdir public
          cp index.html style.css app.js updates.js config.js sw.js manifest.webmanifest public/
          cp -R assets public/
          touch public/.nojekyll
          node scripts/package-release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
